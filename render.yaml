services:
  - type: web
    name: card-shop-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: card-shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "https://your-frontend.vercel.app,https://your-frontend.netlify.app"
    healthCheckPath: /api/health

  - type: web
    name: card-shop-frontend
    env: static
    buildCommand: cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/dist
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://card-shop-api.onrender.com

databases:
  - name: card-shop-db
    plan: free
    databaseName: card_shop
    user: card_shop
